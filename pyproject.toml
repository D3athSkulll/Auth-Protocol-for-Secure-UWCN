[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwcn"
version = "0.1.0"
description = "PEECC-based Underwater Wireless Communication Network (UWCN) authentication protocol simulation and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "UWCN Authentication Project Contributors" }]
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
